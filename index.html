<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9b2226">
<title>毛概选择题 · 刷题</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f7f3ec; --surface:#ffffff; --surface-2:#fbf8f3;
  --ink:#221d18; --ink-2:#57504a; --muted:#8d857b;
  --line:#e9e2d7; --line-2:#ded4c6;
  --accent:#9b2226; --accent-bg:#9b2226; --accent-fg:#fff; --accent-soft:#f9ecea;
  --gold:#b08d57;
  --ok:#2f7d5b; --ok-soft:#eaf4ee; --ok-line:#bfe0cd;
  --bad:#bf3b2b; --bad-soft:#fbedeb; --bad-line:#f2c9c3;
  --shadow:0 1px 2px rgba(40,32,24,.04),0 14px 34px -22px rgba(40,32,24,.45);
  --radius:18px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
}
[data-theme="dark"]{
  --bg:#141216; --surface:#1d1a20; --surface-2:#242028;
  --ink:#f0ebe4; --ink-2:#c3bbb1; --muted:#8f877e;
  --line:#302a34; --line-2:#3d3644;
  --accent:#e07069; --accent-bg:#b23b36; --accent-fg:#fff; --accent-soft:#311b1c;
  --gold:#c9a86e;
  --ok:#6cc79a; --ok-soft:#17302a; --ok-line:#2a5241;
  --bad:#ef8272; --bad-soft:#331d1c; --bad-line:#5c2f2a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 16px 36px -20px rgba(0,0,0,.9);
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
body::before{
  content:"";position:fixed;inset:0 0 auto 0;height:320px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 100% at 50% 0%,rgba(155,34,38,.075),transparent 72%);
}
[data-theme="dark"] body::before{background:radial-gradient(120% 100% at 50% 0%,rgba(224,112,105,.09),transparent 72%)}
button{font-family:inherit}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 18px calc(64px + env(safe-area-inset-bottom))}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:18px 0 6px;min-height:56px}
.top-mid{flex:1;min-width:0;text-align:center}
.top-title{font-size:16px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.06em;font-size:15px}
.brand-mark{
  width:28px;height:28px;border-radius:9px;background:var(--accent-bg);color:var(--accent-fg);
  display:grid;place-items:center;font-size:14px;font-family:var(--serif);font-weight:700;
  box-shadow:0 3px 10px -4px rgba(155,34,38,.8);
}
.icon-btn{
  width:38px;height:38px;flex:0 0 38px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:17px;cursor:pointer;
  display:grid;place-items:center;transition:.18s;line-height:1;
}
.icon-btn:hover{border-color:var(--line-2);color:var(--ink);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.9);transition-duration:.1s}

/* ---------- screens ---------- */
.screen{display:none}
.screen.active{display:block;animation:fade .26s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- home ---------- */
.hero{padding:30px 0 4px;text-align:center}
.eyebrow{font-size:11.5px;letter-spacing:.36em;color:var(--gold);font-weight:600;text-transform:uppercase}
.hero h1{
  font-family:var(--serif);font-size:clamp(30px,6vw,42px);margin:12px 0 10px;
  letter-spacing:.06em;font-weight:700;line-height:1.25;
}
.hero .sub{color:var(--muted);font-size:13.5px;margin:0;font-variant-numeric:tabular-nums}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);margin:26px 0 0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.stats>div{padding:16px 12px;text-align:center;border-right:1px solid var(--line)}
.stats>div:last-child{border-right:0}
.stats b{display:block;font-size:22px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.3}
.stats span{font-size:12px;color:var(--muted);letter-spacing:.06em}
.stats .pbar{grid-column:1/-1;border-top:1px solid var(--line);padding:0;height:4px;border-right:0}
.stats .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#c25b4f);border-radius:0 4px 4px 0;transition:width .5s}

.resume{
  display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px 16px;border-radius:14px;
  background:var(--accent-soft);border:1px solid rgba(155,34,38,.22);animation:fade .3s both;
}
[data-theme="dark"] .resume{border-color:rgba(224,112,105,.28)}
.resume .rt{flex:1;min-width:0}
.resume .rt b{display:block;font-size:14px;color:var(--ink)}
.resume .rt span{font-size:12.5px;color:var(--muted)}
.resume .btn{flex:0 0 auto}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0 0}
.mode{
  position:relative;overflow:hidden;text-align:left;padding:22px 20px;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);
  box-shadow:var(--shadow);transition:transform .2s,border-color .2s,box-shadow .2s;
}
.mode:hover{transform:translateY(-3px);border-color:rgba(155,34,38,.45);box-shadow:0 18px 34px -22px rgba(40,32,24,.5)}
.mode .ico{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;margin-bottom:14px;
  background:var(--accent-soft);color:var(--accent);
}
.mode h3{margin:0 0 6px;font-size:17.5px;letter-spacing:.02em}
.mode p{margin:0;font-size:12.8px;color:var(--muted);line-height:1.6}
.mode .arrow{position:absolute;right:18px;bottom:18px;color:var(--accent);opacity:.7;font-size:15px}
.mode::after{
  content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(155,34,38,.10),transparent 70%);
}
[data-theme="dark"] .mode::after{background:radial-gradient(circle,rgba(224,112,105,.14),transparent 70%)}

.settings{
  margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 18px;box-shadow:var(--shadow);
}
.set-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-label{flex:0 0 84px;font-size:13px;color:var(--muted);letter-spacing:.04em}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;
  font-size:12.5px;color:var(--ink-2);cursor:pointer;transition:.16s;line-height:1.5;
}
.chip:hover{border-color:var(--line-2);background:var(--surface-2)}
.chip:active{transform:scale(.94);transition-duration:.08s}
.chip.on{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--accent-fg);font-weight:600}

.quick{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.qbtn{
  flex:1 1 0;min-width:120px;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:12px;border-radius:13px;border:1px solid var(--line);background:var(--surface);
  font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:.16s;box-shadow:var(--shadow);
}
.qbtn:hover{border-color:var(--line-2);color:var(--ink);transform:translateY(-1px)}
.qbtn em{font-style:normal;font-size:11.5px;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:999px;font-weight:600;font-variant-numeric:tabular-nums}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin:26px 0 0;letter-spacing:.02em}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;transition:.18s;
  min-height:44px;letter-spacing:.02em;
}
.btn:hover{border-color:var(--line-2);transform:translateY(-1px)}
.btn:active{transform:scale(.96);transition-duration:.12s}
.btn{transition:transform .22s cubic-bezier(.34,1.4,.64,1),border-color .18s,background .18s,filter .18s}
.btn.primary{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--accent-fg);box-shadow:0 6px 16px -8px rgba(155,34,38,.9)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.sm{padding:8px 14px;min-height:36px;font-size:13px;border-radius:10px}
.link{background:none;border:0;color:var(--accent);font-size:12.5px;cursor:pointer;padding:4px 6px;text-decoration:underline;text-underline-offset:3px}

/* ---------- chapter list ---------- */
.chlist{display:grid;gap:12px;margin-top:14px}
.chcard{
  display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;
  transition:transform .18s,border-color .18s,box-shadow .18s;
}
.chcard:hover{transform:translateY(-2px);border-color:rgba(155,34,38,.4);box-shadow:0 18px 34px -24px rgba(40,32,24,.5)}
.ch-left{flex:1;min-width:0}
.ch-name{font-size:17px;font-weight:700;letter-spacing:.04em;font-family:var(--serif);margin-bottom:3px}
.ch-meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ch-prog{height:4px;background:var(--line);border-radius:4px;margin:10px 0 6px;overflow:hidden;max-width:260px}
.ch-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#c25b4f);border-radius:4px;transition:width .6s cubic-bezier(.22,.9,.3,1)}
.ch-hint{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ch-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto}
.mini{
  padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);
  font-size:11.5px;color:var(--ink-2);cursor:pointer;transition:.15s;white-space:nowrap;
}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.hot{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.go{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.04em;white-space:nowrap}

/* ---------- quiz ---------- */
.qbar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 0}
.qbar i{display:block;height:100%;min-width:5px;background:linear-gradient(90deg,var(--accent),#c25b4f);border-radius:99px;transition:width .3s ease}
.qcard{
  touch-action:pan-y;
  position:relative;
  margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:26px 26px 22px;box-shadow:var(--shadow);
}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tagnum{
  font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:3px 9px;border-radius:7px;letter-spacing:.04em;font-variant-numeric:tabular-nums;
}
.tag{
  font-size:11.5px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);
  color:var(--ink-2);background:var(--surface-2);letter-spacing:.04em;white-space:nowrap;
}
.tag.single{color:#1f5fa8;border-color:#cfe0f2;background:#eef5fc}
.tag.multi{color:#8a5a12;border-color:#f0dfc0;background:#fdf5e7}
[data-theme="dark"] .tag.single{color:#8ec0f5;border-color:#26425e;background:#182636}
[data-theme="dark"] .tag.multi{color:#e2bd7b;border-color:#4d3d22;background:#2a2216}
.star{
  margin-left:auto;background:none;border:0;font-size:19px;line-height:1;color:var(--muted);
  cursor:pointer;padding:2px 4px;transition:transform .15s,color .15s;
}
.star:hover{transform:scale(1.15)}
.star.on{color:var(--gold)}
.qstem{
  font-size:16.5px;line-height:1.92;letter-spacing:.012em;margin:0 0 18px;
  color:var(--ink);white-space:pre-wrap;word-break:break-word;
}
.qstem em{font-style:normal;color:var(--accent);font-weight:600}
.opts{display:grid;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:13px 15px;border-radius:13px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-size:14.5px;line-height:1.75;cursor:pointer;transition:.16s;
}
.opt:hover:not(:disabled){border-color:var(--line-2);background:var(--surface-2);transform:translateX(2px)}
.opt:active:not(:disabled){transform:scale(.99);transition-duration:.08s}
.opt:disabled{cursor:default}
.opt-key{
  flex:0 0 25px;height:25px;margin-top:2px;border-radius:8px;background:#f0ebe2;color:#6d6459;
  display:grid;place-items:center;font-size:12.5px;font-weight:700;letter-spacing:.02em;transition:.16s;
}
[data-theme="dark"] .opt-key{background:#2c2731;color:#b3a99d}
.opt-text{flex:1;min-width:0;word-break:break-word}
.mk{flex:0 0 auto;font-size:15px;font-weight:700;margin-top:2px}
.mk-ok{color:var(--ok)}
.mk-bad{color:var(--bad)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .opt-key{background:var(--accent-bg);color:var(--accent-fg)}
.opt.correct{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.correct .opt-key{background:var(--ok);color:#fff}
[data-theme="dark"] .opt.correct .opt-key{color:#0e1a15}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .opt-key{background:var(--bad);color:#fff}
[data-theme="dark"] .opt.wrong .opt-key{color:#1b0f0c}
.opt.dim{opacity:.5}

.fb{
  display:flex;gap:12px;margin-top:18px;padding:15px 17px;border-radius:14px;
  border:1px solid var(--line);animation:pop .22s ease both;
}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.99)}to{opacity:1;transform:none}}
.fb.ok{background:var(--ok-soft);border-color:var(--ok-line)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad-line)}
.fb-icon{
  flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:800;color:#fff;background:var(--ok);margin-top:1px;
}
.fb.bad .fb-icon{background:var(--bad)}
.fb-body{flex:1;min-width:0}
.fb-title{font-size:14.5px;font-weight:700;margin-bottom:4px}
.fb.ok .fb-title{color:var(--ok)}
.fb.bad .fb-title{color:var(--bad)}
.fb-line{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ansbox{
  display:inline-block;font-weight:700;letter-spacing:.16em;color:var(--ok);
  background:rgba(47,125,91,.10);padding:1px 8px;border-radius:6px;margin:0 4px;
}
.fb.bad .ansbox{color:var(--ok);background:rgba(47,125,91,.12)}
.your{margin-left:8px;color:var(--muted)}
.qa{display:flex;gap:10px;margin-top:20px;align-items:center}
.qa .spacer{flex:1}
.qa .btn{white-space:nowrap}
.hint{font-size:11.5px;color:var(--muted);text-align:center;margin:16px 0 0;letter-spacing:.02em}
.hint kbd{
  font-family:ui-monospace,Consolas,monospace;font-size:10.5px;padding:1px 5px;border-radius:4px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);margin:0 1px;
}
.hint-inline{font-size:12px;color:var(--muted);letter-spacing:.03em;margin-right:14px}
.kbdhint{display:inline}
@media (hover:none){.kbdhint{display:none}.hint-inline{margin-right:0}}
@media(max-width:560px){.kbdhint{display:none}}

/* ---------- modal / palette ---------- */
.modal{position:fixed;inset:0;display:none;z-index:80;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.veil{position:absolute;inset:0;background:rgba(24,18,14,.45);backdrop-filter:blur(3px);animation:fade .2s both}
.sheet{
  position:relative;background:var(--surface);border-radius:20px;padding:20px;
  width:min(580px,100%);max-height:82vh;display:flex;flex-direction:column;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:pop .2s both;border:1px solid var(--line);
}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:15.5px;flex:1;letter-spacing:.03em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;overflow:auto;padding:2px}
.pcell{
  aspect-ratio:1/1;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
  font-size:12.5px;color:var(--ink-2);cursor:pointer;transition:.14s;font-variant-numeric:tabular-nums;
}
.pcell:hover{transform:translateY(-1px);border-color:var(--line-2)}
.pcell.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok);font-weight:600}
.pcell.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad);font-weight:600}
.pcell.cur{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- result ---------- */
.scorecard{
  display:flex;align-items:center;gap:26px;margin-top:16px;padding:24px;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
}
.ringwrap{position:relative;flex:0 0 140px;width:140px;height:140px}
.ringtext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtext b{font-size:38px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ringtext span{font-size:12px;color:var(--muted);margin-top:4px}
.scorestats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px 10px}
.scorestats>div b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.3}
.scorestats>div span{font-size:12px;color:var(--muted)}
.card{
  margin-top:14px;padding:20px 22px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
}
.card-t{margin:0 0 14px;font-size:14.5px;letter-spacing:.04em;color:var(--ink)}
.chrow{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.chrow:last-child{margin-bottom:0}
.chrow .cn{flex:0 0 178px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.chrow .cb{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.chrow .cb i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ok),#5fae86);transition:width .6s cubic-bezier(.22,.9,.3,1)}
.chrow .cs{flex:0 0 auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.list-item{
  padding:13px 0;border-bottom:1px dashed var(--line);cursor:pointer;
}
.list-item:last-child{border-bottom:0}
.list-item .li-top{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap}
.list-item .li-stem{font-size:13.5px;color:var(--ink-2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.list-item.open .li-stem{-webkit-line-clamp:unset;overflow:visible}
.list-item .li-ans{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.list-item .li-ans b{color:var(--ok);letter-spacing:.12em}
.pv-opts{margin-top:10px;display:grid;gap:6px;animation:fade .2s both}
.pv-opts[hidden]{display:none}
.pv-opt{display:flex;gap:9px;font-size:13px;line-height:1.65;padding:8px 11px;border-radius:9px;border:1px solid var(--line);color:var(--ink-2)}
.pv-opt.ok{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ink)}

<script>
window.__errs = [];
function __showErr(){
  var b = document.getElementById("errbar");
  if(!b || !window.__errs.length) return;
  b.style.display = "block";
  b.textContent = "诊断信息：" + window.__errs.join(" ｜ ");
}
window.addEventListener("error", function(e){
  window.__errs.push("错误：" + (e.message || "未知") + "（行 " + (e.lineno || "?") + "）");
  __showErr();
});
window.addEventListener("unhandledrejection", function(e){
  window.__errs.push("异步错误：" + ((e.reason && e.reason.message) || e.reason || "未知"));
  __showErr();
});
document.addEventListener("DOMContentLoaded", __showErr);
</script>

"},{"id":"188","type":"single","chapter":"第八章 科学发展观","stem":"胡锦涛这个重大判断,深刻总结了国内外社会主义建设的历史经验,深化了对社会主义本质的认识。()","options":["\"社会和谐是中国特色社会主义的本质属性。\"","\"社会主义核心价值体系是根源于民族优秀文化和社会主义先进文化并吸收人类文明成果发展起来的\"","\"每一个共产党员都要把人民放在心中最高位置,尊重人民主体地位,尊重人民首创精神,拜人民为师,\"","\"物质贫乏不是社会主义,精神空虚也不是社会主义。没有社会主义文化繁荣发展,就没有社会主义现代化\""],"answer":"A"},{"id":"189","type":"single","chapter":"第八章 科学发展观","stem":"()是马克思主义政党的本质属性,是马克思主义政党的生命所系、力量所在。","options":["先进性","阶级性","全民性","群众性"],"answer":"A"},{"id":"190","type":"single","chapter":"第八章 科学发展观","stem":"科学发展观最鲜明的精神实质是:()","options":["解放思想、实事求是、与时俱进、求真务实坚持党的先进性","立党为公,执政为民","实事求是、群众路线、独立自主","真理性与实践性、科学性与开放性和历史性与时代性的统一"],"answer":"A"},{"id":"191","type":"single","chapter":"第八章 科学发展观","stem":"科学发展观:()","options":["创造性地回答了什么是社会主义、怎样建设社会主义","创造性地建设什么样的党、怎样建设党的问题","创造性地回答了新形势下实现什么样的发展、怎样发展等重大问题","创造性地回答了新时代进行什么样的伟大革命、怎样进行伟大革命的问题"],"answer":"C"},{"id":"192","type":"single","chapter":"第八章 科学发展观","stem":"我们党的文件中第一次提出科学发展观是在:()","options":["《中共中央关于完善社会主义市场经济体制若干问题的决定》中","《中共中央关于加强党的执政能力建设的决定》中","《中共中央关于构建社会主义和谐社会若干重大问题的决定》中","《中共中央关于制定国民经济和社会发展第十一个五年规划的建议》中"],"answer":"A"},{"id":"193","type":"single","chapter":"第八章 科学发展观","stem":"科学发展观的核心立场是:()","options":["全面发展","协调发展","以人为本","可持续发展"],"answer":"C"},{"id":"194","type":"single","chapter":"第八章 科学发展观","stem":"科学发展观的第一要义是:()","options":["以人为本","稳定","改革","发展"],"answer":"D"},{"id":"195","type":"single","chapter":"第八章 科学发展观","stem":"科学发展观的基本要求是:()","options":["以人为本","全面协调可持续","统筹兼顾","发展"],"answer":"B"},{"id":"196","type":"single","chapter":"第八章 科学发展观","stem":"科学发展观的根本方法是:()","options":["以人为本","全面协调可持续","统筹兼顾","发展"],"answer":"C"},{"id":"197","type":"single","chapter":"第八章 科学发展观","stem":"坚持以人为本,最终是为了()","options":["实现社会主义现代化","实现人的全面发展","实现中华民族伟大复兴的中国梦","实现持久和平、共同繁荣的和谐世界"],"answer":"B"},{"id":"198","type":"single","chapter":"第八章 科学发展观","stem":"科学发展观强调,推动经济持续健康发展,必须坚持的主题:()","options":["以人为本","科学发展","中国特色社会主义现代经济体系","人的全面发展"],"answer":"B"},{"id":"199","type":"single","chapter":"第八章 科学发展观","stem":"科学发展观强调,推动经济持续健康发展,必须坚持的主线:() const SUBJ = {"A卷":[{"q":"中国革命为什么能走农村包围城市、武装夺取政权的道路？","a":["中国革命必须走农村包围城市、武装夺取政权的道路，是由中国所处的时代特点和具体国情所决定的。一方面，中国内无民主，外无主权，中国革命的主要斗争形式只能是武装斗争，革命的主要组织形式必然是军队。另一方面，近代中国是一个农业大国，农民占全国人口的绝大多数，是无产阶级可靠的同盟军和革命的主力军。另一方面，党的领导非常非常重要，党非常重要。相当力量正是红军的存在，为农村革命根据地的创立、巩固和发展提供了坚实的后盾。党的领导的有力量及其政策的不错误，为农村革命根据地的建设和发展提供了重要的主观条件。"]},{"q":"中国社会主义改造的历史经验有哪些？","a":["第一，坚持社会主义工业化建设与社会主义改造同时并举。社会主义改造是围绕着社会主义工业化建设这个中心任务进行的。实践证明，坚持同时并举，对于保持社会稳定、促进生产力发展具有重要意义。","第二，采取积极引导、逐步过渡的方式。我国对农业、手工业和资本主义工商业的改造，都采取了区别对象、逐步过渡的方式。这种办法符合农民的特点和生产力状况。","第三，用和平方法进行改造。在我国的条件下，用和平的方法（即说服教育的方法）改变所有制。坚持用和平的办法，不仅保证了改造的顺利进行，而且维护了社会的稳定。"]},{"q":"如何调动一切积极因素为社会主义事业服务？","a":["第一，调动一切积极因素，尽可能地克服消极因素，并努力化消极因素为积极因素，是社会主义事业前进的现实需要。在社会主义事业的发展中，一般来说，积极因素是处于主导的、统治地位的，占有压倒的优势，这是社会主义事业不断前进的可靠保证。","第二，调动一切积极因素为社会主义事业服务，必须坚持中国共产党的领导。毛泽东多次强调：“领导我们事业的核心力量是中国共产党。”中国共产党是全中国人民的领导核心。","第三，调动一切积极因素为社会主义事业服务，必须发展社会主义民主政治。党的八大提出，要进一步扩大民主生活，开展反对官僚主义的斗争。毛泽东强调指出，我们的目标是想造成一个又有集中又有民主，又有纪律又有自由，生动活泼，那样一种政治局面。"]},{"q":"为什么说中国共产党始终代表最广大人民的根本利益？","a":["第一，人民是我们国家的主人，是决定我国前途和命运的根本力量，是历史真正的创造者。我们全部工作的出发点和落脚点就是不断实现好、维护好、发展好最广大人民的根本利益。","第二，我们党来自人民，根植于人民，服务于人民，一切为了群众，一切相信群众，一切依靠群众，我们党就能获得取之不尽的力量源泉。","第三，我们党始终坚持人民的利益高于一切，我们党进行的一切斗争，归根到底是为了最广大人民的根本利益，党的一切工作必须以最广大人民的根本利益为最高标准。"]},{"q":"如何理解全面协调可持续发展是科学发展观的基本要求？","a":["一方面，经过长期发展，我们积累了较为雄厚的物质基础条件，可以推进全面协调可持续发展上有更大的作为。另一方面，城乡区域发展不平衡，经济社会发展不协调，经济发展与人口资源环境不适应等问题更加突出的摆在了我们的面前，我们只有更加自觉地推进全面协调可持续发展，才能更好化解制约我国发展的各种因素。更好地推动我国发展进程，确保实现我国发展的战略目标。"]},{"q":"为什么要实行对外开放政策？","a":["第一，开放也是改革，对外开放是建设中国特色社会主义的一项基本国策，和改革一起成为新时期最鲜明的特征。","第二，实行对外开放是对中国经济发展停滞落后历史教训深刻总结的结果。邓小平反复强调：“任何国家要发达起来，闭关自守都不可能。我们吃过这个苦头，我们的老祖宗吃过这个苦头。”历史经验一再告诉我们，关起门来搞建设是不行的，把自己孤立于世界之外是不利的。只有实行对外开放，才能赶上时代，赶上当代世界的科技和经济发展水平。","第三，对外开放是对世界所有国家的开放，包括对发达国家的开放，也包括对发展中国家的开放；不仅是经济领域的开放，还包括科技、教育、文化等领域的开放。在实行对外开放过程中，一要正确对待资本主义社会创造的现代文明成果，大胆吸收和借鉴；二是要高度珍惜并坚决维护中国人民经过长期奋斗得来的独立自主权利。"]},{"q":"邓小平的社会主义市场经济理论的内涵。","a":["邓小平的社会主义市场经济理论具有丰富的内涵。","一是计划经济和市场经济不是划分社会制度的标志，计划经济不等于社会主义，市场经济也不等于资本主义。","二是计划和市场都是经济手段对经济活动的调节各有优劣，社会主义实行市场经济是要把两者优势结合起来。","三是市场经济作为资源配置手段本身不具有制度属性，可以和不同的社会制度结合，从而表现出不同的性质。"]}],"B卷":[{"q":"为什么说实事求是是毛泽东思想的精髓？","a":["实事求是是毛泽东思想的基本点，是毛泽东思想的精髓，实事求是就是一切从实际出发，理论联系实际，坚持在实践中检验真理和发展真理。","第二点，实事求是来源于马克思主义基本原理，贯穿于马克思主义中国化的全过程。","第三点，实事求是思想路线由毛泽东同志确立于民主革命时期，在党的历史实践上，它是生死抉择的准则，在党的各个历史时期，实事求是被利用到了极致。例如在遵义会议时期，正是由于党坚持了实事求是，才纠正了左倾教条主义错误，挽救了红军，挽救了党。在党的各个历史时期我们都是依靠实事求是取得了一些大成果，它是指导我们不断革命、建设和改革胜利的重要法宝。"]},{"q":"毛泽东思想的历史地位是什么？","a":["第一，马克思主义中国化时代化的第一个重大理论成果。毛泽东是马克思主义中国化时代化的伟大开拓者，是毛泽东思想的主要创立者。他明确提出了马克思主义中国化时代化的重大任务，并为此进行了艰苦的探索。","第二，中国革命和建设的科学指南。在毛泽东思想指引下，我们党领导全国人民，找到了一条新民主主义革命的正确道路，完成了反帝反封建的任务。毛泽东思想是被实践证明了的关于中国革命和建设的正确的理论原则和经验总结。","第三，中国共产党和中国人民宝贵的精神财富。毛泽东思想永远是我们全党、全军、全国各族人民的最宝贵的精神财富。毛泽东追求和倡导的实事求是的思想路线、全心全意为人民服务的根本宗旨等，依然是中国人民不断奋进的强大精神动力。"]},{"q":"新民主主义革命的基本纲领。","a":["第一，新民主主义革命的政治纲领是推翻帝国主义和封建主义的统治，建立一个无产阶级领导的，以工农联盟为基础的各革命阶级联合专政的、新民主主义的共和国。","第二，新民主主义的经济纲领是没收封建地主阶级的土地归农民所有，没收官僚资产阶级的垄断资本归新民主主义的国家所有，保护民族工商业。","第三，新民主主义文化就是无产阶级领导的人民大众的反帝反封建的文化，即民族的、科学的、大众的文化。"]},{"q":"三大法宝的含义及三者的关系。","a":["总述：统一战线，武装斗争，党的建设，是党在中国革命中战胜敌人的三个重要法宝。","第一，统一战线是无产阶级政党策略思想的重要内容。建立最广泛的统一战线，首先是由中国半殖民地半封建社会的阶级状况所决定的。","第二，武装斗争是中国革命的特点和优点之一。由于反动派总是凭借暴力镇压人民，革命人民只有以武装的革命反对武装的反革命。","第三，中国共产党要领导革命取得胜利，必须不断加强党的思想建设、组织建设和作风建设。由于各种非无产阶级思想必然反映到党内来，必须把思想建设放在首位。","最后，关于三者的关系：统一战线和武装斗争是中国革命的两个基本特点，是战胜敌人的两个基本武器。统一战线是实行武装斗争的统一战线。武装斗争是统一战线的中心支柱，党的组织则是掌握统一战线和武装斗争这两个武器以实行对敌冲锋陷阵的英勇战士。"]},{"q":"党在过渡时期的总路线。","a":["党在过渡时期的总路线主要内容被概括为一化三改。一化即社会主义工业化，三改即对个体农业、手工业、资本主义工商业的社会主义改造。它们之间相互联系，不可分离，可以比喻为鸟的主体和两翼。其中一化是主体，三改是两翼，二者相辅相成，相互促进。这是一条社会主义建设和社会主义改造同时并举的路线，体现了社会主义工业化和社会主义改造的紧密结合，体现了解放生产力与发展生产力，变革生产关系与发展生产力的有机统一。"]},{"q":"解放思想实事求是，对推动中国特色社会主义事业的意义。","a":["第一，解放思想实事求是，有力推动和保证了拨乱反正的进行。","第二，解放思想实事求是，破除了僵化的社会主义模式观念，坚持走自己的路。","第三，解放思想实事求是，一切从社会主义初级阶段的实际出发。","第四，坚持解放思想实事求是，坚持以三个有利于作为检验一切工作是非得失的根本标准，破除了在改革开放进程中离开发展生产力抽象谈论姓社姓资的思维定势，把我国的改革开放和现代化建设推进到一个新的阶段。"]},{"q":"邓小平理论的历史地位是什么？","a":["第一，马克思列宁主义、毛泽东思想的继承和发展。邓小平理论是马克思列宁主义基本原理同当代中国实际和时代特征相结合的产物。它用一系列独创性的思想、观点，继承、丰富和发展了马克思列宁主义、毛泽东思想。","第二，中国特色社会主义理论体系的开篇之作。邓小平理论紧紧抓住“什么是社会主义、怎样建设社会主义”这个基本问题，第一次比较系统地初步回答了建设中国特色社会主义的一系列基本问题。","第三，改革开放和社会主义现代化建设的科学指南。邓小平理论指导了改革开放的伟大实践。在它的指导下，改革开放后的中国发生天翻地覆的变化，迎来了思想的解放、经济的发展。"]}]};

/* 完成反馈：粒子爆发（交互一），放完即清理节点 */
function burst(anchor){
  if(RM() || !anchor || !anchor.animate) return;
  const card = anchor.closest(".qcard");
  if(!card) return;
  const cr = card.getBoundingClientRect(), ar = anchor.getBoundingClientRect();
  const cx = ar.left - cr.left + ar.width / 2, cy = ar.top - cr.top + ar.height / 2;
  const colors = ["var(--ok)", "var(--accent)", "var(--gold)"];
  for(let i = 0; i < 8; i++){
    const d = document.createElement("span");
    const sz = 4 + Math.random() * 4;
    d.className = "burst-dot";
    d.style.cssText = `left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;background:${colors[i % 3]}`;
    card.appendChild(d);
    const ang = (Math.PI * 2 * i) / 8 + Math.random() * .5;
    const dist = 30 + Math.random() * 30;
    const anim = d.animate([
      {transform: "translate(-50%,-50%) scale(1)", opacity: 1},
      {transform: `translate(${Math.cos(ang) * dist - sz / 2}px,${Math.sin(ang) * dist - sz / 2}px) scale(.4)`, opacity: 0}
    ], {duration: 480 + Math.random() * 120, easing: "cubic-bezier(.17,.67,.35,1)"});
    anim.onfinish = () => d.remove();
    anim.oncancel = () => d.remove();
  }
}

/* 数字补间（交互二：数字不跳数） */
function tweenNum(el, to, suffix){
  if(!el) return;
  suffix = suffix || "";
  if(RM()){ el.textContent = to + suffix; return; }
  const dur = 520, t0 = performance.now();
  (function step(now){
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * e) + suffix;
    if(p < 1) requestAnimationFrame(step);
  })(t0);
}

/* 圆形扩散转场（交互六）：从最近一次点击点展开新页面 */
let revealArmed = false;
function armReveal(){ revealArmed = true; }
function playReveal(el){
  return; /* 已停用：clip-path 扩散动画在部分 WebView 中会卡住并裁掉整屏内容 */
  if(!el || RM() || !el.animate || !lastTap || Date.now() - lastTap.t > 600) return;
  const r = el.getBoundingClientRect();
  const x = lastTap.x - r.left, y = lastTap.y - r.top;
  const rad = Math.hypot(Math.max(x, r.width - x), Math.max(y, r.height - y)) + 40;
  try{
    el.animate([
      {clipPath: `circle(0px at ${x}px ${y}px)`},
      {clipPath: `circle(${rad}px at ${x}px ${y}px)`}
    ], {duration: 450, easing: "cubic-bezier(.22,.9,.3,1)"});
  }catch(e){}
}

function diagnoseScreen(name){
  const scr = document.getElementById("screen-" + name);
  if(!scr || !scr.classList.contains("active")) return;
  const card = scr.querySelector(".qcard");
  const info = ["screen=" + name, "lock=" + document.body.classList.contains("quiz-lock")];
  info.push("scrH=" + Math.round(scr.getBoundingClientRect().height));
  info.push("vhVar=" + (getComputedStyle(document.documentElement).getPropertyValue("--vh") || "未设置"));
  info.push("innerH=" + window.innerHeight);
  if(!card){
    info.push("card=不存在");
    if(name === "quiz" && typeof S !== "undefined" && S) info.push("queue=" + (S.queue || []).length + " idx=" + S.idx + " label=" + S.label);
    if(name === "subj" && typeof SJ !== "undefined" && SJ) info.push("sjQueue=" + SJ.queue.length + " i=" + SJ.i);
  } else {
    const r = card.getBoundingClientRect();
    info.push("cardH=" + Math.round(r.height) + " cardTop=" + Math.round(r.top));
    if(r.height >= 80) return;
  }
  window.__errs.push(info.join(" "));
  if(window.__showErr) window.__showErr();
}

          " scrH=" + Math.round(scr.getBoundingClientRect().height) +
          " bodyHTML=" + ((name === "quiz" ? document.getElementById("quizBody") : document.getElementById("subjBody")) || {}).innerHTML?.length +
          " innerH=" + window.innerHeight + " scrollY=" + window.scrollY);
        if(window.__showErr) window.__showErr();
      }
    }, 500);
  }
}

function showScreen(name){
  if(name === "quiz" || name === "subj"){
    setTimeout(() => diagnoseScreen(name), 700);
    setTimeout(() => healScreen(name), 900);
    syncVH();
    requestAnimationFrame(syncVH);
    setTimeout(syncVH, 280);
  }
  document.body.classList.toggle("quiz-lock", name === "quiz" || name === "subj");
  const pal = document.getElementById("palette");
  if(pal) pal.classList.remove("on");
  $$(".screen").forEach(s => s.classList.toggle("active", s.id === "screen-" + name));
  window.scrollTo(0, 0);
  if(revealArmed){
    revealArmed = false;
    playReveal(document.getElementById("screen-" + name));
  }
}

/* ================= 首页 ================= */
function renderHome(){
  const total = BANK.length;
  const singles = BANK.filter(q => q.type === "single").length;
  $("#heroMeta").textContent = `共 ${total} 题 · 单选 ${singles} · 多选 ${total - singles} · ${CHAPTERS.length} 个章节`;

  const ids = Object.keys(STATS);
  let at = 0, ok = 0;
  ids.forEach(id => { at += STATS[id].n; ok += STATS[id].k; });
  tweenNum($("#statSeen"), ids.length);
  if(at) tweenNum($("#statAcc"), Math.round(ok / at * 100), "%"); else $("#statAcc").textContent = "—";
  tweenNum($("#statProg"), Math.round(ids.length / total * 100), "%");
  $("#statBar").style.width = (ids.length / total * 100) + "%";

  $("#nWrong").textContent = Object.keys(WRONG).length;
  $("#nFav").textContent = FAV.length;

  const saved = LS.get(K.sess, null);
  const box = $("#resumeBox");
  if(saved && !saved.finished && saved.queue && saved.queue.length){
    const done = Object.values(saved.rec || {}).filter(r => r.submitted).length;
    box.innerHTML = `
      <div class="resume">
        <div class="rt">
          <b>继续上次练习</b>
          <span>${esc(saved.label || "练习")} · 已答 ${done} / ${saved.queue.length} 题</span>
        </div>
        <button class="btn primary sm" id="resumeBtn">继续</button>
      </div>`;
    $("#resumeBtn").onclick = () => {
      saved.queue = (saved.queue || []).filter(id => byId.has(id));
      if(!saved.queue.length){ LS.set(K.sess, null); renderHome(); return toast("上次练习数据已失效"); }
      saved.idx = Math.min(saved.idx || 0, saved.queue.length - 1);
      if(!saved.rec) saved.rec = {};
      S = saved;
      S.stamp = Date.now();
      S.elapsed = saved.elapsed || 0;
      startTimer(); showScreen("quiz"); renderQuiz();
    };
  } else {
    box.innerHTML = "";
  }
}

/* ================= 章节列表 ================= */
function renderChapters(){
  const list = $("#chapterList");
  $("#chSub").textContent = CFG.type === "all" ? "全部题型" : (CFG.type === "single" ? "仅单项选择题" : "仅多项选择题");
  list.innerHTML = CHAPTERS.map(ch => {
    const qs = BANK.filter(q => q.chapter === ch);
    const pool = qs.filter(q => CFG.type === "all" || q.type === CFG.type);
    const s = qs.filter(q => q.type === "single").length;
    const m = qs.length - s;
    const done = qs.filter(q => STATS[q.id]).length;
    let n = 0, k = 0;
    qs.forEach(q => { if(STATS[q.id]){ n += STATS[q.id].n; k += STATS[q.id].k; } });
    const wrongN = qs.filter(q => WRONG[q.id]).length;
    const pct = qs.length ? Math.round(done / qs.length * 100) : 0;
    return `
      <div class="chcard" data-ch="${esc(ch)}">
        <div class="ch-left">
          <div class="ch-name">${esc(ch)}</div>
          <div class="ch-meta">共 ${qs.length} 题 · 单选 ${s} · 多选 ${m}</div>
          <div class="ch-prog"><i style="width:${pct}%"></i></div>
          <div class="ch-hint">已练 ${done} / ${qs.length}${n ? ` · 正确率 ${Math.round(k / n * 100)}%` : ""}${pool.length !== qs.length ? ` · 当前筛选 ${pool.length} 题` : ""}</div>
        </div>
        <div class="ch-right">
          <button class="mini" data-act="memo" data-ch="${esc(ch)}">背题</button>
          ${wrongN ? `<button class="mini hot" data-act="wrong" data-ch="${esc(ch)}">错题 ${wrongN}</button>` : ""}
          <span class="go">开始 →</span>
        </div>
      </div>`;
  }).join("");

  $$("#chapterList .ch-prog i").forEach(bar => {
    const w = bar.style.width;
    bar.style.width = "0%";
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = w; }));
  });

  $$("#chapterList .chcard").forEach(card => {
    card.onclick = e => {
      const mb = e.target.closest('[data-act="memo"]');
      const wb = e.target.closest('[data-act="wrong"]');
      const ch = card.dataset.ch;
      if(mb){
        e.stopPropagation();
        startSession({mode:"chapter", chapter:ch, memo:true, label:ch + " · 背题"});
        return;
      }
      if(wb){
        e.stopPropagation();
        const ids = BANK.filter(q => q.chapter === ch && WRONG[q.id]).map(q => q.id);
        if(!ids.length) return toast("本章暂无错题");
        startSession({mode:"chapter", chapter:ch, ids, label:ch + " · 错题"});
        return;
      }
      startSession({mode:"chapter", chapter:ch, label:ch});
    };
  });
}

/* ================= 会话 ================= */
function startTimer(){
  clearInterval(tick);
  S.stamp = Date.now();
  tick = setInterval(() => {
    const el = $("#qTimer");
    if(el && S) el.textContent = fmt(elapsedSec());
  }, 500);
}
function elapsedSec(){
  if(!S) return 0;
  return (S.elapsed || 0) + Math.floor((Date.now() - (S.stamp || Date.now())) / 1000);
}
function saveSession(){
  if(!S) return;
  const snap = Object.assign({}, S, {elapsed: elapsedSec(), stamp: Date.now()});
  LS.set(K.sess, snap);
}

function startSession(opts){
  let pool;
  if(opts.ids) pool = opts.ids.map(id => byId.get(id)).filter(Boolean);
  else pool = BANK.filter(q => (!opts.chapter || q.chapter === opts.chapter) &&
                               (CFG.type === "all" || q.type === CFG.type));
  if(!pool.length) return toast("该范围下没有题目");

  if(CFG.order === "shuffle") shuffle(pool);
  else pool.sort((a, b) => Number(a.id) - Number(b.id));
  if(!opts.ids && CFG.limit > 0 && pool.length > CFG.limit) pool = pool.slice(0, CFG.limit);

  let label = opts.label || "练习";
  if(opts.mode === "mixed" && !opts.ids) label = "混合练习";
  const optOrder = {};
  pool.forEach(q => {
    const ord = q.options.map((_, i) => i);
    if(CFG.optorder === "shuffle") shuffle(ord);
    optOrder[q.id] = ord;
  });
  S = {
    mode: opts.mode, chapter: opts.chapter || null, label,
    queue: pool.map(q => q.id), idx: 0, rec: {}, optOrder,
    elapsed: 0, stamp: Date.now(), finished: false, startedAt: Date.now(),
    memo: !!opts.memo,
    replay: {mode: opts.mode, chapter: opts.chapter || null, ids: opts.ids || null, label, memo: !!opts.memo}
  };
  armReveal();
  saveSession();
  startTimer();
  showScreen("quiz");
  renderQuiz();
}
function curQ(){ return byId.get(S.queue[S.idx]); }

/* ================= 答题 ================= */
function toggleOpt(k){
  if(S && S.memo) return;
  const q = curQ();
  let r = S.rec[q.id];
  if(r && r.submitted) return;
  if(!r) r = S.rec[q.id] = {sel: [], submitted: false};

  if(!isMulti(q)){
    r.sel = [k];
    if(CFG.auto){ submitCurrent(); return; }
  } else {
    const i = r.sel.indexOf(k);
    if(i >= 0) r.sel.splice(i, 1); else r.sel.push(k);
  }
  saveSession();
  renderQuiz();
}

function memoFinish(){
  clearInterval(tick); S.finished = true; saveSession();
  showScreen("home"); renderHome(); toast("本组已背完");
}

function submitCurrent(){
  const q = curQ();
  const r = S.rec[q.id];
  if(!r || !r.sel.length || r.submitted) return;
  r.submitted = true;
  r.ok = norm(r.sel) === q.answer;

  const st = STATS[q.id] || (STATS[q.id] = {n: 0, k: 0});
  st.n++; if(r.ok) st.k++;
  LS.set(K.stats, STATS);

  if(r.ok){
    if(WRONG[q.id]){ delete WRONG[q.id]; LS.set(K.wrong, WRONG); }
  } else {
    const w = WRONG[q.id] || (WRONG[q.id] = {n: 0, t: 0});
    w.n++; w.t = Date.now();
    LS.set(K.wrong, WRONG);
  }
  saveSession();
  renderQuiz();
  const fbEl = $("#quizBody .fb");
  if(fbEl){
    if(r.ok){
      fbEl.classList.add("celebrate");
      burst(fbEl.querySelector(".fb-icon"));
    } else {
      fbEl.classList.add("shake-it");
    }
  }
}

function go(i){
  if(i < 0 || i >= S.queue.length) return;
  S.idx = i;
  saveSession();
  renderQuiz();
}
function next(){
  if(S.idx >= S.queue.length - 1) finish();
  else go(S.idx + 1);
}

function finish(){
  if(!S) return;
  clearInterval(tick);
  S.elapsed = elapsedSec();
  S.stamp = Date.now();
  S.finished = true;
  LS.set(K.sess, S);
  showResult();
}

function toggleFav(){
  const q = curQ();
  const i = FAV.indexOf(q.id);
  if(i >= 0){ FAV.splice(i, 1); toast("已取消收藏"); }
  else { FAV.push(q.id); toast("已加入收藏"); }
  LS.set(K.fav, FAV);
  renderQuiz();
}

/* ================= 渲染答题 ================= */
function renderQuiz(){
  const q = curQ();
  if(!q){
    S = null;
    LS.set(K.sess, null);
    showScreen("home");
    renderHome();
    toast("上次练习数据已失效，已返回首页");
    return;
  }
  if(!S.rec) S.rec = {};
  const r = S.rec[q.id];
  const sub = !!(r && r.submitted);
  const sel = r ? r.sel : [];
  const ans = q.answer.split("");
  const total = S.queue.length;

  $("#qzLabel").textContent = S.label || "练习";
  $("#qzProgress").textContent = (S.idx + 1) + " / " + total;
  $("#qbarFill").style.width = ((S.idx + 1) / total * 100) + "%";
  const tEl = $("#qTimer"); if(tEl) tEl.textContent = fmt(elapsedSec());

  const ord = (S.optOrder && S.optOrder[q.id]) || q.options.map((_, i) => i);
  const opts = ord.map((oi, di) => {
    const text = q.options[oi];
    const k = LETTERS[oi];
    const isAns = ans.includes(k);
    const isSel = sel.includes(k);
    let cls = "";
    if(S.memo){
      cls = isAns ? "correct" : "dim";
    } else if(sub){
      if(isAns) cls = "correct";
      else if(isSel) cls = "wrong";
      else cls = "dim";
    } else if(isSel) cls = "sel";
    const mark = (sub || S.memo)
      ? (isAns ? '<span class="mk mk-ok">✓</span>' : (isSel ? '<span class="mk mk-bad">✗</span>' : ""))
      : "";
    return `<button class="opt ${cls}" data-k="${k}" ${sub || S.memo ? "disabled" : ""}>
              <span class="opt-key">${LETTERS[di]}</span>
              <span class="opt-text">${esc(text)}</span>${mark}
            </button>`;
  }).join("");

  let fb = "";
  if(S.memo){
    fb = `<div class="fb ok">
            <div class="fb-icon">答</div>
            <div class="fb-body">
              <div class="fb-title">背题模式 · 本题答案</div>
              <div class="fb-line">正确答案 <span class="ansbox">${q.answer.split("").join(" ")}</span></div>
            </div>
          </div>`;
  } else if(sub){
    const missed = ans.filter(k => !sel.includes(k));
    const extra = sel.filter(k => !ans.includes(k));
    let title, cls;
    if(r.ok){ title = "回答正确"; cls = "ok"; }
    else if(isMulti(q) && missed.length && !extra.length){ title = "漏选"; cls = "bad"; }
    else if(isMulti(q) && extra.length && !missed.length){ title = "多选"; cls = "bad"; }
    else { title = "回答错误"; cls = "bad"; }
    fb = `<div class="fb ${cls}">
            <div class="fb-icon">${cls === "ok" ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 10 18 20 6"/></svg>' : "!"}</div>
            <div class="fb-body">
              <div class="fb-title">${title}</div>
              <div class="fb-line">正确答案 <span class="ansbox">${q.answer.split("").join(" ")}</span>
                <span class="your">你的答案 <b>${sel.length ? sel.slice().sort().join("") : "—"}</b></span></div>
            </div>
          </div>`;
  }

  const last = S.idx === total - 1;
  let actions = "";
  if(S.memo){
    actions = `<button class="btn ghost" data-act="prev" ${S.idx === 0 ? "disabled" : ""}>← 上一题</button>
               <span class="spacer"></span>
               <button class="btn primary" data-act="next">${last ? "完成背诵" : "下一题 →"}</button>`;
  } else
  if(!sub){
    if(isMulti(q) || !CFG.auto){
      actions = `<button class="btn ghost" data-act="prev" ${S.idx === 0 ? "disabled" : ""}>← 上一题</button>
                 <span class="spacer"></span>
                 <button class="btn ghost" data-act="skip">跳过</button>
                 <button class="btn primary" data-act="submit" ${sel.length ? "" : "disabled"}>提交答案</button>`;
    } else {
      actions = `<button class="btn ghost" data-act="prev" ${S.idx === 0 ? "disabled" : ""}>← 上一题</button>
                 <span class="spacer"></span>
                 <button class="btn ghost" data-act="skip">跳过</button>`;
    }
  } else {
    actions = `<button class="btn ghost" data-act="prev" ${S.idx === 0 ? "disabled" : ""}>← 上一题</button>
               <span class="spacer"></span>
               <button class="btn primary" data-act="next">${last ? "完成练习" : "下一题 →"}</button>`;
  }

  const multiHint = S.memo
    ? `<span class="hint-inline">背题模式 · 正确答案已用 ✓ 标出 · 左右滑动翻题</span>`
    : isMulti(q)
    ? `<span class="hint-inline">多项选择 · 选好后点击提交</span>`
    : (CFG.auto ? `<span class="hint-inline">单项选择 · 点选即判分</span>` : `<span class="hint-inline">单项选择 · 选好后点击提交</span>`);

  $("#quizBody").innerHTML = `
    <div class="qcard">
      <div class="qmeta">
        <span class="tagnum"># ${q.id}</span>
        <span class="tag ${q.type}">${isMulti(q) ? "多选" : "单选"}</span>
        <span class="tag qch" title="${esc(q.chapter)}">${esc(q.chapter)}</span>
        <button class="star ${FAV.includes(q.id) ? "on" : ""}" data-act="fav" title="收藏">${FAV.includes(q.id) ? "★" : "☆"}</button>
      </div>
      <p class="qstem">${esc(q.stem)}</p>
      <div class="opts">${opts}</div>
      ${fb}
      <div class="qa">${actions}</div>
      <p class="hint">${multiHint}<span class="kbdhint">快捷键 <kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>D</kbd> 选择 · <kbd>Enter</kbd> 提交/下一题 · <kbd>←</kbd><kbd>→</kbd> 切换</span></p>
    </div>`;

  $$("#quizBody .opt").forEach(b => b.onclick = () => toggleOpt(b.dataset.k));
  $$("#quizBody [data-act]").forEach(b => {
    b.onclick = () => {
      const a = b.dataset.act;
      if(a === "prev") go(S.idx - 1);
      else if(a === "next"){
        if(S.memo && S.idx >= S.queue.length - 1) memoFinish();
        else next();
      }
      else if(a === "skip") next();
      else if(a === "submit") submitCurrent();
      else if(a === "fav") toggleFav();
    };
  });
}
</script>
<script>
"use strict";
/* ================= 答题卡 ================= */
function openPalette(){
  $("#pgrid").innerHTML = S.queue.map((id, i) => {
    const r = S.rec[id];
    let cls = "";
    if(r && r.submitted) cls = r.ok ? "ok" : "bad";
    return `<button class="pcell ${cls} ${i === S.idx ? "cur" : ""}" data-i="${i}">${id}</button>`;
  }).join("");
  $("#palette").classList.add("on");
  const cur = $("#pgrid .pcell.cur");
  if(cur) cur.scrollIntoView({block: "center"});
}
function closePalette(){ $("#palette").classList.remove("on"); }

/* ================= 报告 ================= */
function showResult(){
  const total = S.queue.length;
  let answered = 0, ok = 0;
  const byCh = {};
  S.queue.forEach(id => {
    const q = byId.get(id), r = S.rec[id];
    const c = byCh[q.chapter] || (byCh[q.chapter] = {n: 0, ok: 0});
    c.n++;
    if(r && r.submitted){ answered++; if(r.ok){ ok++; c.ok++; } }
  });
  const pct = total ? Math.round(ok / total * 100) : 0;
  const wrongIds = S.queue.filter(id => { const r = S.rec[id]; return r && r.submitted && !r.ok; });

  const C = 2 * Math.PI * 52;
  const color = pct >= 80 ? "var(--ok)" : (pct >= 60 ? "var(--gold)" : "var(--bad)");

  $("#rsSub").textContent = `${S.label || "练习"} · 用时 ${fmt(S.elapsed || 0)}`;

  $("#resultBody").innerHTML = `
    <div class="scorecard">
      <div class="ringwrap">
        <svg width="140" height="140" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"></circle>
          <circle cx="60" cy="60" r="52" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="${pct > 0 ? "round" : "butt"}"
                  stroke-dasharray="${(C * pct / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"
                  style="transition:stroke-dasharray .6s ease"></circle>
        </svg>
        <div class="ringtext"><b>${pct}</b><span>得分</span></div>
      </div>
      <div class="scorestats">
        <div><b>${ok}</b><span>答对</span></div>
        <div><b>${answered - ok}</b><span>答错</span></div>
        <div><b>${total - answered}</b><span>未作答</span></div>
        <div><b>${total}</b><span>总题数</span></div>
      </div>
    </div>

    <div class="card">
      <h3 class="card-t">章节表现</h3>
      ${Object.keys(byCh).map(ch => {
        const c = byCh[ch];
        const p = c.n ? Math.round(c.ok / c.n * 100) : 0;
        return `<div class="chrow">
          <span class="cn">${esc(ch)}</span>
          <span class="cb"><i style="width:${p}%"></i></span>
          <span class="cs">${c.ok}/${c.n}</span>
        </div>`;
      }).join("")}
    </div>

    ${wrongIds.length ? `
    <div class="card">
      <h3 class="card-t">本次错题 · ${wrongIds.length} <span style="font-weight:400;font-size:12px;color:var(--muted)">（点击题目展开选项）</span></h3>
      ${wrongIds.map(id => {
        const q = byId.get(id);
        return `<div class="list-item" data-id="${id}">
          <div class="li-top"><span class="tagnum"># ${q.id}</span>
            <span class="tag ${q.type}">${isMulti(q) ? "多选" : "单选"}</span>
            <span class="tag">${esc(q.chapter)}</span></div>
          <div class="li-stem">${esc(q.stem)}</div>
          <div class="li-ans">正确答案 <b>${q.answer.split("").join(" ")}</b></div>
          <div class="pv-opts" hidden>${q.options.map((t, i) => {
            const k = LETTERS[i];
            const on = q.answer.includes(k);
            return `<div class="pv-opt ${on ? "ok" : ""}"><span class="k">${k}</span><span>${esc(t)}</span></div>`;
          }).join("")}</div>
        </div>`;
      }).join("")}
    </div>` : ""}

    <div class="qa wrap" style="margin-top:18px">
      <button class="btn ghost" data-r="home">返回首页</button>
      <span class="spacer"></span>
      <button class="btn ghost" data-r="again">再练一次</button>
      <button class="btn primary" data-r="redo" ${wrongIds.length ? "" : "disabled"}>重做错题${wrongIds.length ? " (" + wrongIds.length + ")" : ""}</button>
    </div>`;

  (function(){
    const ring = $("#resultBody .ringwrap circle:nth-child(2)");
    if(ring && !RM()){
      const target = ring.getAttribute("stroke-dasharray");
      ring.style.transition = "none";
      ring.setAttribute("stroke-dasharray", "0 " + C.toFixed(1));
      requestAnimationFrame(() => requestAnimationFrame(() => {
        ring.style.transition = "stroke-dasharray .7s cubic-bezier(.22,.9,.3,1)";
        ring.setAttribute("stroke-dasharray", target);
      }));
    }
    const big = $("#resultBody .ringtext b");
    if(big) tweenNum(big, pct);
    $$("#resultBody .chrow .cb i").forEach(bar => {
      const w = bar.style.width;
      bar.style.width = "0%";
      requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = w; }));
    });
  })();

  $$("#resultBody .list-item").forEach(el => {
    el.onclick = () => {
      el.classList.toggle("open");
      const pv = el.querySelector(".pv-opts");
      if(pv) pv.hidden = !el.classList.contains("open");
    };
  });
  $$("#resultBody [data-r]").forEach(b => {
    b.onclick = () => {
      const a = b.dataset.r;
      if(a === "home"){ showScreen("home"); renderHome(); }
      else if(a === "again"){
        const p = S.replay || {};
        startSession({mode: p.mode || "mixed", chapter: p.chapter || null, ids: p.ids || null, label: p.label, memo: !!p.memo});
      }
      else if(a === "redo") startSession({mode: S.mode, chapter: S.chapter, ids: wrongIds, label: (S.label || "练习") + " · 错题重做"});
    };
  });
  showScreen("result");
}

/* ================= 错题本 / 收藏夹 ================= */
function qPreviewHTML(q, extra){
  return `<div class="list-item" data-id="${q.id}">
      <div class="li-top">
        <span class="tagnum"># ${q.id}</span>
        <span class="tag ${q.type}">${isMulti(q) ? "多选" : "单选"}</span>
        <span class="tag">${esc(q.chapter)}</span>
        ${extra || ""}
      </div>
      <div class="li-stem">${esc(q.stem)}</div>
      <div class="li-ans">正确答案 <b>${q.answer.split("").join(" ")}</b></div>
      <div class="pv-opts" hidden>${q.options.map((t, i) => {
        const k = LETTERS[i], on = q.answer.includes(k);
        return `<div class="pv-opt ${on ? "ok" : ""}"><span class="k">${k}</span><span>${esc(t)}</span></div>`;
      }).join("")}</div>
    </div>`;
}
function bindPreview(root){
  $$(root + " .list-item").forEach(el => {
    el.onclick = () => {
      el.classList.toggle("open");
      const pv = el.querySelector(".pv-opts");
      if(pv) pv.hidden = !el.classList.contains("open");
    };
  });
}

  const body = $("#wrongBody");
  if(!ids.length){
    body.innerHTML = `<div class="empty"><span class="big">✦</span>暂无错题，继续保持</div>`;
    return;
  }
  body.innerHTML = `
    <div class="qa wrap" style="margin:16px 0 6px">
      <button class="btn primary" id="wbPractice">练习全部错题 (${ids.length})</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="wbClear">清空</button>
    </div>
    <div class="card" style="margin-top:10px">
      <h3 class="card-t">共 ${ids.length} 题 <span style="font-weight:400;font-size:12px;color:var(--muted)">（点击题目展开选项，答对后自动移出）</span></h3>
      ${ids.map(id => {

/* ================= 事件绑定 ================= */

/* ================= 主观题（背诵看答案，无自评） ================= */
let SJSEEN = LS.get("mg_subj_seen_v1", []);
let SJ = null;
let homeKind = LS.get("mg_kind_v1", "choice");

function sjKey(it){ return it.paper + it.n; }
function sjItems(paper){
  return SUBJ[paper].map((it, i) => ({paper, n: i + 1, q: it.q, a: it.a}));
}
function renderSubjHome(){
  const seenA = SJSEEN.filter(k => k[0] === "A").length;
  const seenB = SJSEEN.filter(k => k[0] === "B").length;
  const total = seenA + seenB;
  $("#sjSeenN").textContent = total;
  $("#sjProgN").textContent = Math.round(total / 14 * 100) + "%";
  $("#sjBar").style.width = (total / 14 * 100) + "%";
  $("#sjSubA").textContent = "共 7 题 · 已看 " + seenA + " 题";
  $("#sjSubB").textContent = "共 7 题 · 已看 " + seenB + " 题";
}
function setKind(kind){
  homeKind = kind;
  LS.set("mg_kind_v1", kind);
  $$("#kindSeg button").forEach(b => b.classList.toggle("on", b.dataset.kind === kind));
  const isSubj = kind === "subj";
  ["#screen-home > .stats", "#resumeBox", "#screen-home > .modes", "#screen-home > .settings", "#screen-home > .quick"]
    .forEach(sel => $$(sel).forEach(el => { el.style.display = isSubj ? "none" : ""; }));
  $("#subjHome").style.display = isSubj ? "" : "none";
  $("#heroTitle").textContent = isSubj ? "主观题背诵" : "选择题刷题";
  $("#footNote").textContent = isSubj
    ? "题库来源：主观题背诵汇总（A/B卷）.docx ｜ 记录仅保存在本机浏览器"
    : "题库来源：毛概题库.docx ｜ 记录仅保存在本机浏览器 ｜ 版本 D7";
  if(isSubj){
    $("#heroMeta").textContent = "问答题背诵汇总 · A 卷 7 题 · B 卷 7 题 · 共 14 题";
    renderSubjHome();
  } else {
    renderHome();
  }
}
function startSubj(mode){
  let queue, label;
  if(mode === "R"){
    queue = shuffle([...sjItems("A卷"), ...sjItems("B卷")]);
    label = "随机抽背";
  } else {
    queue = sjItems(mode);
    label = mode + "背诵";
  }
  SJ = {label, queue, i: 0, rev: {}};
  armReveal();
  showScreen("subj");
  renderSubj();
}
function sjFinish(){
  SJ = null;
  showScreen("home");
  renderSubjHome();
  toast("本组已背完");
}
function renderSubj(){
  if(!SJ) return;
  const it = SJ.queue[SJ.i], total = SJ.queue.length, key = sjKey(it);
  const revealed = !!SJ.rev[key];
  $("#sjLabel").textContent = SJ.label;
  $("#sjProgress").textContent = (SJ.i + 1) + " / " + total;
  $("#sjBarFill").style.width = ((SJ.i + 1) / total * 100) + "%";
  let ans = "";
  if(revealed){
    if(it.a.length === 1){
      ans = `<div class="sj-points"><div class="sj-point plain">${esc(it.a[0])}</div></div>`;
    } else {
      ans = `<div class="sj-points">` + it.a.map((p, i) =>
        `<div class="sj-point" style="animation-delay:${i * 70}ms"><span class="no">${i + 1}</span><span>${esc(p)}</span></div>`).join("") + `</div>`;
    }
  }
  const last = SJ.i === total - 1;
  const actions = revealed
    ? `<button class="btn ghost" data-sj="prev" ${SJ.i === 0 ? "disabled" : ""}>← 上一题</button>
       <span class="spacer"></span>
       <button class="btn primary" data-sj="next">${last ? "完成背诵" : "下一题 →"}</button>`
    : `<button class="btn ghost" data-sj="prev" ${SJ.i === 0 ? "disabled" : ""}>← 上一题</button>
       <span class="spacer"></span>
       <button class="btn primary" data-sj="reveal">查看参考答案</button>`;
  $("#subjBody").innerHTML = `
    <div class="qcard">
      <div class="qmeta">
        <span class="tagnum">${esc(it.paper)} · 第 ${it.n} 题</span>
        <span class="tag">问答题</span>
        <span class="hint-inline">${revealed ? "参考答案 · 对照一下自己默答的要点" : "先在心里默答，再点开答案"}</span>
      </div>
      <p class="qstem">${esc(it.q)}</p>
      ${ans}
      <div class="qa">${actions}</div>
    </div>`;
  const card = $("#subjBody .qcard");
  if(card) card.scrollTop = 0;
}
function sjGo(i){
  if(!SJ) return;
  SJ.i = Math.max(0, Math.min(SJ.queue.length - 1, i));
  renderSubj();
}
function sjReveal(){
  if(!SJ) return;
  const key = sjKey(SJ.queue[SJ.i]);
  SJ.rev[key] = true;
  if(!SJSEEN.includes(key)){
    SJSEEN.push(key);
    LS.set("mg_subj_seen_v1", SJSEEN);
  }
  renderSubj();
}
function sjNext(){
  if(!SJ) return;
  if(SJ.i >= SJ.queue.length - 1) sjFinish();
  else sjGo(SJ.i + 1);
}
function openSjPalette(){
  if(!SJ) return;
  $("#sjGrid").innerHTML = SJ.queue.map((it, i) => {
    const seen = SJSEEN.includes(sjKey(it)) || SJ.rev[sjKey(it)];
    return `<button class="pcell ${seen ? "seen" : ""} ${i === SJ.i ? "cur" : ""}" data-sji="${i}">${it.paper[0]}${it.n}</button>`;
  }).join("");
  $("#sjPalette").classList.add("on");
  const cur = $("#sjGrid .pcell.cur");
  if(cur) cur.scrollIntoView({block: "nearest"});
}
function closeSjPalette(){ $("#sjPalette").classList.remove("on"); }

function bindEvents(){
  $$("[data-theme-toggle]").forEach(b => b.onclick = toggleTheme);

  syncVH();
  window.addEventListener("resize", syncVH);
  window.addEventListener("orientationchange", syncVH);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", syncVH);

  $("#modeChapter").onclick = () => { armReveal(); renderChapters(); showScreen("chapters"); };
  $("#modeMixed").onclick = () => startSession({mode:"mixed", label:"混合练习"});
  $("#modeMemo").onclick = () => startSession({mode:"memo", memo:true, label:"背题模式"});

  $$("#settings .chip").forEach(c => c.onclick = () => setCfg(c.dataset.k, c.dataset.v));

  $("#goWrong").onclick = () => { renderWrong(); showScreen("wrong"); };
  $("#goFav").onclick = () => { renderFav(); showScreen("fav"); };
  $("#resetAll").onclick = () => {
    if(!confirm("将清空所有做题记录、错题本和收藏，确定吗？")) return;
    STATS = {}; WRONG = {}; FAV = []; S = null;
    LS.set(K.stats, STATS); LS.set(K.wrong, WRONG); LS.set(K.fav, FAV);
    try{ localStorage.removeItem(K.sess); }catch(e){}
    renderHome(); toast("已重置全部记录");
  };

  $("#chBack").onclick = () => { showScreen("home"); renderHome(); };
  $("#qzBack").onclick = () => {
    saveSession();
    if(S){ S.elapsed = elapsedSec(); S.stamp = Date.now(); }
    clearInterval(tick);
    showScreen("home"); renderHome();
  };
  $("#qzPalette").onclick = openPalette;
  $("#rsHome").onclick = () => { showScreen("home"); renderHome(); };
  $("#wbBack").onclick = () => { showScreen("home"); renderHome(); };
  $("#fvBack").onclick = () => { showScreen("home"); renderHome(); };

  $("#palette").addEventListener("click", e => {
    if(e.target.closest("[data-close]")) return closePalette();
    const cell = e.target.closest(".pcell");
    if(cell){ closePalette(); go(Number(cell.dataset.i)); }
  });

  /* 背题模式：左右滑动翻题 */
  (function(){
    const zone = $("#quizBody");
    if(!zone) return;
    let sw = null;
    const TH = 64;
    function reset(card){
      card.style.transform = "";
      card.style.opacity = "";
    }
    function springBack(card){
      if(RM() || !card.animate){ reset(card); return; }
      const cur = card.style.transform, op = card.style.opacity;
      const a = card.animate([
        {transform: cur || "translateX(0px)", opacity: op || "1"},
        {transform: "translateX(0px)", opacity: "1"}
      ], {duration: 240, easing: "cubic-bezier(.34,1.35,.64,1)"});
      a.onfinish = () => reset(card);
      a.oncancel = () => reset(card);
    }
    function slideOut(card, dir, after){
      if(RM() || !card.animate){ after(); return; }
      const a = card.animate([
        {transform: card.style.transform || "translateX(0px)", opacity: card.style.opacity || "1"},
        {transform: `translateX(${dir * 55}%)`, opacity: "0"}
      ], {duration: 160, easing: "cubic-bezier(.5,0,.8,.4)", fill: "forwards"});
      a.onfinish = after;
      a.oncancel = after;
    }
    function enterFrom(dir){
      if(RM()) return;
      const card = $("#quizBody .qcard");
      if(!card || !card.animate) return;
      card.animate([
        {transform: `translateX(${dir * 44}px)`, opacity: "0"},
        {transform: "translateX(0px)", opacity: "1"}
      ], {duration: 210, easing: "cubic-bezier(.22,.9,.3,1)"});
    }
    zone.addEventListener("pointerdown", e => {
      sw = null;
      if(!S || !S.memo) return;
      if(e.target.closest("[data-act]")) return;
      const card = e.target.closest(".qcard");
      if(!card) return;
      sw = {x: e.clientX, y: e.clientY, card, dx: 0, active: false};
    });
    window.addEventListener("pointermove", e => {
      if(!sw) return;
      const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
      if(!sw.active){
        if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.3) sw.active = true;
        else if(Math.abs(dy) > 12){ sw = null; return; }
        else return;
      }
      sw.dx = dx;
      sw.card.style.transform = `translateX(${dx * 0.55}px)`;
      sw.card.style.opacity = String(1 - Math.min(0.35, Math.abs(dx) / 500));
    }, {passive: true});
    function endSwipe(){
      if(!sw) return;
      const s = sw; sw = null;
      if(!s.active) return;
      const card = s.card;
      if(s.dx <= -TH){
        if(S.idx >= S.queue.length - 1) slideOut(card, -1, memoFinish);
        else slideOut(card, -1, () => { go(S.idx + 1); enterFrom(1); });
      } else if(s.dx >= TH){
        if(S.idx <= 0) springBack(card);
        else slideOut(card, 1, () => { go(S.idx - 1); enterFrom(-1); });
      } else springBack(card);
    }
    window.addEventListener("pointerup", endSwipe);
    window.addEventListener("pointercancel", () => {
      if(sw && sw.active) springBack(sw.card);
      sw = null;
    });
  })();

  document.addEventListener("keydown", e => {
    const t = e.target;
    if(t && typeof t.matches === "function" && t.matches("input,textarea")) return;
    if($("#palette").classList.contains("on")){
      if(e.key === "Escape") closePalette();
      return;
    }
    if(!$("#screen-quiz").classList.contains("active")) return;
    const q = curQ();
    const k = e.key.toUpperCase();
    let idx = -1;
    if(k.length === 1 && k >= "A" && k <= "E") idx = k.charCodeAt(0) - 65;
    else if(k >= "1" && k <= "5") idx = Number(k) - 1;
    if(idx >= 0 && idx < q.options.length){
      e.preventDefault();
      const ord2 = (S.optOrder && S.optOrder[q.id]) || q.options.map((_, i) => i);
      toggleOpt(LETTERS[ord2[idx]]);
      return;
    }
    if(e.key === "Enter"){
      e.preventDefault();
      if(S.memo){
        if(S.idx >= S.queue.length - 1) memoFinish();
        else go(S.idx + 1);
        return;
      }
      const r = S.rec[q.id];
      if(r && r.submitted) next();
      else if(r && r.sel.length) submitCurrent();
      return;
    }
    if(e.key === "ArrowRight"){
      e.preventDefault();
      if(S.memo && S.idx >= S.queue.length - 1) memoFinish();
      else next();
    }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(S.idx - 1); }
  });

  /* 主观题入口与背诵屏 */
  $$("#kindSeg button").forEach(b => { b.onclick = () => setKind(b.dataset.kind); });
  $("#sjPaperA").onclick = () => startSubj("A卷");
  $("#sjPaperB").onclick = () => startSubj("B卷");
  $("#sjRandom").onclick = () => startSubj("R");
  $("#sjBack").onclick = () => { SJ = null; showScreen("home"); };
  $("#sjPalBtn").onclick = openSjPalette;
  $("#sjPalette").addEventListener("click", e => {
    if(e.target.closest("[data-sjclose]")){ closeSjPalette(); return; }
    const cell = e.target.closest("[data-sji]");
    if(cell && SJ){ closeSjPalette(); sjGo(parseInt(cell.dataset.sji, 10)); }
  });
  $("#subjBody").addEventListener("click", e => {
    const b = e.target.closest("[data-sj]");
    if(!b || !SJ) return;
    const a = b.dataset.sj;
    if(a === "prev") sjGo(SJ.i - 1);
    else if(a === "reveal") sjReveal();
    else if(a === "next") sjNext();
  });
  document.addEventListener("keydown", e => {
    if(!$("#screen-subj").classList.contains("active") || !SJ) return;
    if(e.key === "ArrowLeft"){ e.preventDefault(); sjGo(SJ.i - 1); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); sjNext(); }
    else if(e.key === "Enter"){
      e.preventDefault();
      if(SJ.rev[sjKey(SJ.queue[SJ.i])]) sjNext(); else sjReveal();
    }
  });
  /* 主观题：左右滑动翻题 */
  (function(){
    const zone = $("#subjBody");
    if(!zone) return;
    let sw = null;
    const TH = 64;
    function reset(card){ card.style.transform = ""; card.style.opacity = ""; }
    function springBack(card){
      if(RM() || !card.animate){ reset(card); return; }
      const a = card.animate([
        {transform: card.style.transform || "translateX(0px)", opacity: card.style.opacity || "1"},
        {transform: "translateX(0px)", opacity: "1"}
      ], {duration: 240, easing: "cubic-bezier(.34,1.35,.64,1)"});
      a.onfinish = () => reset(card); a.oncancel = () => reset(card);
    }
    function slideOut(card, dir, after){
      if(RM() || !card.animate){ after(); return; }
      const a = card.animate([
        {transform: card.style.transform || "translateX(0px)", opacity: card.style.opacity || "1"},
        {transform: `translateX(${dir * 55}%)`, opacity: "0"}
      ], {duration: 160, easing: "cubic-bezier(.5,0,.8,.4)", fill: "forwards"});
      a.onfinish = after; a.oncancel = after;
    }
    function enterFrom(dir){
      if(RM()) return;
      const card = $("#subjBody .qcard");
      if(!card || !card.animate) return;
      card.animate([
        {transform: `translateX(${dir * 44}px)`, opacity: "0"},
        {transform: "translateX(0px)", opacity: "1"}
      ], {duration: 210, easing: "cubic-bezier(.22,.9,.3,1)"});
    }
    zone.addEventListener("pointerdown", e => {
      sw = null;
      if(!SJ) return;
      if(e.target.closest("[data-sj]")) return;
      const card = e.target.closest(".qcard");
      if(!card) return;
      sw = {x: e.clientX, y: e.clientY, card, dx: 0, active: false};
    });
    window.addEventListener("pointermove", e => {
      if(!sw) return;
      const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
      if(!sw.active){
        if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.3) sw.active = true;
        else if(Math.abs(dy) > 12){ sw = null; return; }
        else return;
      }
      sw.dx = dx;
      sw.card.style.transform = `translateX(${dx * 0.55}px)`;
      sw.card.style.opacity = String(1 - Math.min(0.35, Math.abs(dx) / 500));
    }, {passive: true});
    function endSwipe(){
      if(!sw) return;
      const s = sw; sw = null;
      if(!s.active || !SJ) return;
      const card = s.card;
      if(s.dx <= -TH){
        slideOut(card, -1, () => { if(SJ){ if(SJ.i >= SJ.queue.length - 1) sjFinish(); else { sjGo(SJ.i + 1); enterFrom(1); } } });
      } else if(s.dx >= TH){
        if(SJ.i <= 0) springBack(card);
        else slideOut(card, 1, () => { sjGo(SJ.i - 1); enterFrom(-1); });
      } else springBack(card);
    }
    window.addEventListener("pointerup", endSwipe);
    window.addEventListener("pointercancel", () => { if(sw && sw.active) springBack(sw.card); sw = null; });
  })();
}

/* ================= 启动 ================= */
applyTheme();
syncChips();
renderHome();
bindEvents();
setKind(homeKind);
